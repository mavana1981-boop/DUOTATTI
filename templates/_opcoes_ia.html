{# Opções da leitura com IA — escolhidas ANTES de a leitura começar. #}
{% macro opcoes_ia(c=None, continuar=False, titulo='Leitura com IA') %}
<fieldset style="border:1px solid color-mix(in srgb,currentColor 18%,transparent);border-radius:10px;padding:8px 12px 12px;margin:10px 0">
  <legend style="padding:0 6px"><b>{{ titulo }}</b></legend>
  <label class="f" style="margin-top:2px">Qual IA</label>
  <label style="display:block;margin:4px 0"><input type="radio" name="ia_provedor" value="gemini" {{ 'checked' if ia_gemini }} {{ 'disabled' if not ia_gemini }}>
    Gemini — barato{% if not ia_gemini %} <span class="mut">(não configurado: falta GEMINI_API_KEY)</span>{% endif %}</label>
  {% if eh_admin %}
  <label style="display:block;margin:4px 0"><input type="radio" name="ia_provedor" value="claude" {{ 'checked' if not ia_gemini and ia_claude }} {{ 'disabled' if not ia_claude }}>
    Claude — pago (créditos da Anthropic){% if not ia_claude %} <span class="mut">(não configurado)</span>{% endif %}</label>
  {% endif %}
  <label style="display:block;margin:4px 0"><input type="radio" name="ia_provedor" value="nenhuma" {{ 'checked' if not ia_gemini and not (eh_admin and ia_claude) }}>
    Não usar IA (só o leitor gratuito)</label>
  <label class="f">O que a IA deve ler</label>
  <select name="ia_escopo">
    {% for k, v in escopos.items() %}<option value="{{ k }}" {{ 'selected' if ((c.ia_escopo if c else None) or 'todas') == k }}>{{ v }}</option>{% endfor %}
  </select>
  {% if continuar %}
  <label style="display:block;margin:8px 0 0"><input type="checkbox" name="continuar" value="1" checked>
    Aproveitar as questões que já foram lidas (não paga de novo por elas)</label>
  {% endif %}
</fieldset>
{% endmacro %}
