{# Tatti — mascote do DUOTATTI. Humores: furioso, bravo, neutro, feliz, radiante #}
{% macro tatti(humor='neutro', size=160) %}
{% set nomes = {'furioso':'furiosa','bravo':'brava','neutro':'de olho','feliz':'feliz','radiante':'radiante'} %}
<img class="tatti tatti-{{ humor }}" src="{{ url_for('static', filename='avatar/' ~ humor ~ '.png') }}"
     width="{{ size }}" height="{{ size }}" alt="Tatti está {{ nomes.get(humor, humor) }}" decoding="async">
{% endmacro %}
